trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # PASTE YOUR AZURE PLAIN TEXT CREDENTIALS HERE
  AZURE_CLIENT_ID: 'your-app-client-id'
  AZURE_CLIENT_SECRET: 'your-app-secret-value'
  AZURE_TENANT_ID: 'your-tenant-id'
  AZURE_SUBSCRIPTION_ID: 'your-subscription-id'

steps:
- script: |
    wget -q https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip
    unzip terraform_1.7.5_linux_amd64.zip
    sudo mv terraform /usr/local/bin/
    terraform version
  displayName: 'Install Terraform'

- script: |
    # Force Terraform to use the environment variables for authentication
    export ARM_CLIENT_ID="$(AZURE_CLIENT_ID)"
    export ARM_CLIENT_SECRET="$(AZURE_CLIENT_SECRET)"
    export ARM_TENANT_ID="$(AZURE_TENANT_ID)"
    export ARM_SUBSCRIPTION_ID="$(AZURE_SUBSCRIPTION_ID)"
    
    # 1. Initialize and Launch the Child Module VM
    terraform init
    terraform apply -auto-approve
    
    # 2. Wait 4 minutes
    echo "VM launched successfully! Waiting 4 minutes before automatic deletion..."
    sleep 240
    
    # 3. Destroy and clean up
    echo "4 minutes are up. Deleting everything now..."
    terraform destroy -auto-approve
  displayName: 'Bypass Login and Run Terraform'
